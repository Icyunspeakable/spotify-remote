<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" id="stylesheet" href="main.css">
</head>
<body>
    <div class="panel">
        <div class="volume-control">
            <label class="volume-label" for="volume">Volume</label>
            <input type="range" min="0" max="100" value="50" class="slider" id="volume" aria-valuenow="50" aria-label="Volume">
        </div>
        <div class="info">
            <p class="song" id="song"></p>
            <p class="artist" id="artist"></p>
            <img src="" alt="Album art" class="album-art" id="albumArtElement" hidden />
        </div>
        
        <div class="controls">
            <div class="seek-section">
                <div class="seek-times">
                    <span class="current-time" id="current">0:00</span>
                    <span class="time-sep">/</span>
                    <span class="total-time" id="total">0:00</span>
                </div>
                <input type="range" min="0" max="1000" value="0" class="seek" id="myRange" aria-label="Seek position in track">
            </div>
            <div class="buttons">
                <button type="button" class="control-button" id="prev" aria-label="Previous track">◁</button>
                <button type="button" class="control-button control-button--secondary" id="pause" aria-label="Pause">Pause</button>
                <button type="button" class="control-button control-button--primary" id="play" aria-label="Play">Play</button>
                <button type="button" class="control-button control-button--secondary" id="like" aria-label="Like track">Like</button>
                <button type="button" class="control-button" id="next" aria-label="Next track">▷</button>
            </div>
            <button type="button" class="mode" id="themeSwitcher">Dark mode</button>
        </div>
       
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
